name: Folium synthetic examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Python ${{ matrix.python-version }} synthetic maps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned map dependency
        run: python -m pip install --no-input --disable-pip-version-check -r requirements.txt
      - name: Verify Python source compilation
        run: python -m compileall -q examples tests
      - name: Execute all four legacy examples and coverage-aware QA
        run: python -m unittest discover -s tests -p "test_*.py" -v
